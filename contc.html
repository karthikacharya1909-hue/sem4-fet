<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Karthik Acharya</title>
<style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;min-height:100vh;padding:50px 20px;box-sizing:border-box}h2{text-align:center;font-size:2.5rem;margin-bottom:40px}form{max-width:500px;margin:0 auto;background:#fff;color:#333;padding:30px;border-radius:10px;box-shadow:0 10px 30px #0003}label{display:block;margin:15px 0 5px;font-weight:700}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:5px;box-sizing:border-box;font-size:16px}input[type=submit]{background:#4CAF50;color:#fff;border:none;cursor:pointer;font-weight:700;font-size:18px;transition:background .3s}input[type=submit]:hover{background:#45a049}@media(max-width:768px){form{padding:20px}}</style>
</head>
<body>
<h2>Contact Me</h2>
<form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
  <label for="fname">Full Name:</label>
  <input type="text" id="fname" name="fname" placeholder="Enter your name" required>

  <label for="email">Email Address:</label>
  <input type="email" id="email" name="email" placeholder="example@mail.com" required>

  <label for="purpose">Purpose:</label>
  <select id="purpose" name="purpose" required>
    <option value="">Select...</option>
    <option value="Job Opportunities">Job Opportunities</option>
    <option value="General Inquiry">General Inquiry</option>
    <option value="Other">Other</option>
  </select>

  <label for="message">Message:</label>
  <textarea id="message" name="message" rows="8" placeholder="Type your message here..." required></textarea>

  <input type="submit" value="Send Message">
</form>
</body>
</html>
