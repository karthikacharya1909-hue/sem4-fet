<!DOCTYPE html>
<html>
<head>
<title>Contact Karthik Acharya</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  padding: 50px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.container {
  max-width: 600px;
  width: 100%;
  background: rgba(255,255,255,0.15);
  padding: 50px;
  border-radius: 25px;
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
  animation: slideUp 1s ease-out;
}
h2 {
  text-align: center;
  font-size: 2.8rem;
  margin-bottom: 40px;
  background: linear-gradient(45deg, #fff, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
label {
  display: block;
  margin: 20px 0 8px;
  font-weight: 700;
  color: #333;
  font-size: 1.1rem;
}
input, select, textarea {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  background: rgba(255,255,255,0.9);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
  box-sizing: border-box;
}
input:focus, select:focus, textarea:focus {
  outline: none;
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  background: #fff;
}
input[type="submit"] {
  background: linear-gradient(45deg, #4CAF50, #45a049);
  color: white;
  font-weight: 700;
  font-size: 1.2rem;
  cursor: pointer;
  margin-top: 20px;
  padding: 18px;
  transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
input[type="submit"]:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 20px 40px rgba(76,175,80,0.4);
}
@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 768px) {
  .container {
    padding: 30px 20px;
    margin: 20px;
  }
  h2 { font-size: 2.2rem; }
}
</style>
</head>
<body>
<div class="container">
  <h2>Contact Me</h2>
  <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
    <label for="fname">Full Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Enter your name" required>
    
    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" placeholder="example@mail.com" required>
    
    <label for="Purpose">Choose the purpose:</label>
    <select id="Purpose" name="Purpose" required>
      <option value="">Select an option</option>
      <option value="Job Opportunities">Job Opportunities</option>
      <option value="General Inquiry">General Inquiry</option>
      <option value="Other">Other</option>
    </select>
    
    <label for="message">Message:</label>
    <textarea id="message" name="message" rows="8" placeholder="Type your message here..." required></textarea>
    
    <input type="submit" value="Send Message 🚀">
  </form>
</div>
</body>
</html>
